<header class="navbar-header">
  <mat-toolbar class="navbar-toolbar">
    <div class="navbar-container">
      <!-- Brand & Title -->
      <a
        routerLink="/"
        class="brand-link"
        [attr.aria-label]="'navbar.home.aria' | translate"
      >
        <div class="brand-badge">ROAMS</div>
        <div class="brand-text">
          <span class="app-title">{{ 'navbar.title' | translate }}</span>
          <span class="app-subtitle">{{ 'navbar.subtitle' | translate }}</span>
        </div>
      </a>

      <!-- Right Actions: Currency Selector + Language Switcher -->
      <div class="navbar-actions">
        <app-currency-selector />

        <button
          type="button"
          mat-button
          class="lang-toggle-btn"
          (click)="toggleLanguage()"
          [attr.aria-label]="'navbar.lang.aria' | translate"
        >
          <span class="lang-label">{{ currentLanguage().toUpperCase() }}</span>
          <mat-icon class="lang-icon">translate</mat-icon>
        </button>
      </div>
    </div>
  </mat-toolbar>
</header>
