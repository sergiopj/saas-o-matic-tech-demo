<header class="navbar-header">
  <mat-toolbar class="navbar-toolbar">
    <div class="navbar-container">
      <!-- Left side: Mobile Hamburger Toggle + Brand Link -->
      <div class="navbar-brand-group">
        <button
          type="button"
          mat-icon-button
          class="mobile-menu-btn"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="isMobileMenuOpen()"
          aria-controls="mobile-nav-panel"
          [attr.aria-label]="(isMobileMenuOpen() ? 'navbar.mobileMenu.close' : 'navbar.mobileMenu.open') | translate"
        >
          <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>

        <!-- Brand & Title -->
        <a
          routerLink="/"
          class="brand-link"
          (click)="closeMobileMenu()"
          [attr.aria-label]="'navbar.home.aria' | translate"
        >
          <div class="brand-logo-badge">
            <img
              src="images/roams-logo.png"
              alt="Roams"
              class="brand-logo-img"
              width="100"
              height="30"
            />
          </div>
          <div class="brand-text">
            <span class="app-title">{{ 'navbar.title' | translate }}</span>
            <span class="app-subtitle">{{ 'navbar.subtitle' | translate }}</span>
          </div>
        </a>

        <!-- Transversal Theme Switcher (Top Left) -->
        <app-theme-toggle class="navbar-theme-toggle" />
      </div>

      <!-- Right Actions: Currency Selector + Decoupled Language Selector -->
      <div class="navbar-actions">
        <app-currency-selector />
        <app-language-selector />
      </div>
    </div>
  </mat-toolbar>

  <!-- Mobile Collapsible Top Navigation Dropdown Panel -->
  @if (isMobileMenuOpen()) {
    <div
      class="mobile-backdrop"
      (click)="closeMobileMenu()"
      tabindex="-1"
      aria-hidden="true"
    ></div>
    <nav
      id="mobile-nav-panel"
      class="mobile-nav-panel"
      [attr.aria-label]="'sidebar.aria' | translate"
    >
      <ul class="mobile-nav-list">
        @for (item of navItems; track item.path) {
          <li class="mobile-nav-item">
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              class="mobile-nav-link"
              (click)="closeMobileMenu()"
            >
              <mat-icon class="mobile-nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
              <span class="mobile-nav-label">{{ item.labelKey | translate }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
