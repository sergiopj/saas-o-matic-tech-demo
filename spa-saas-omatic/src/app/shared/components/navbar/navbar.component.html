<header class="navbar-header">
  <mat-toolbar class="navbar-toolbar">
    <div class="navbar-container">
      <!-- Brand & Title -->
      <a
        routerLink="/"
        class="brand-link"
        [attr.aria-label]="'navbar.home.aria' | translate"
      >
        <div class="brand-badge">ROAMS</div>
        <div class="brand-text">
          <span class="app-title">{{ 'navbar.title' | translate }}</span>
          <span class="app-subtitle">{{ 'navbar.subtitle' | translate }}</span>
        </div>
      </a>

      <!-- Right Actions: Currency Selector + Decoupled Language Selector -->
      <div class="navbar-actions">
        <app-currency-selector />
        <app-language-selector />
      </div>
    </div>
  </mat-toolbar>
</header>
