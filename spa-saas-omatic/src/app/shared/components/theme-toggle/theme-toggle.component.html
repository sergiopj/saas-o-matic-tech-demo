<div class="theme-toggle-wrapper">
  <button
    type="button"
    role="switch"
    class="theme-switch-btn"
    [class.is-dark]="isDark()"
    [attr.aria-checked]="isDark()"
    [attr.aria-label]="tooltipText()"
    [matTooltip]="tooltipText()"
    matTooltipPosition="below"
    (click)="toggle()"
  >
    <span class="switch-track" aria-hidden="true">
      <mat-icon class="track-icon sun-icon">wb_sunny</mat-icon>
      <mat-icon class="track-icon moon-icon">dark_mode</mat-icon>
      <span class="switch-thumb">
        <mat-icon class="thumb-icon">{{ isDark() ? 'dark_mode' : 'wb_sunny' }}</mat-icon>
      </span>
    </span>
  </button>

  @if (showComicBubble()) {
    <output
      class="comic-speech-bubble"
      [class.fading-out]="isBubbleFading()"
      (click)="dismissBubble()"
      aria-live="polite"
    >
      <span class="bubble-tail" aria-hidden="true"></span>
      <span class="bubble-content">
        <span class="bubble-icon" aria-hidden="true">✨</span>
        <span class="bubble-text">{{ 'theme.toggle.comicHint' | translate }}</span>
      </span>
      <button
        type="button"
        class="bubble-close-btn"
        (click)="dismissBubble(); $event.stopPropagation()"
        [attr.aria-label]="'theme.toggle.closeHint' | translate"
      >
        &times;
      </button>
    </output>
  }
</div>
