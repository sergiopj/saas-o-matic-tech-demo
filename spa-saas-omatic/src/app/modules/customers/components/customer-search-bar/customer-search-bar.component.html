<div class="search-bar-wrapper">
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
    <mat-icon matPrefix class="search-icon" aria-hidden="true">search</mat-icon>
    <input
      matInput
      type="text"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      [placeholder]="'customers.search.placeholder' | translate"
      [attr.aria-label]="'customers.search.aria' | translate"
    />
    <div matSuffix class="search-actions">
      @if (loading() || isDebouncing()) {
        <mat-spinner diameter="18" strokeWidth="2.5" class="search-spinner" />
      }
      @if (query()) {
        <button
          mat-icon-button
          type="button"
          class="clear-button"
          [attr.aria-label]="'customers.search.clear.aria' | translate"
          (click)="clear()"
        >
          <mat-icon aria-hidden="true">close</mat-icon>
        </button>
      }
    </div>
  </mat-form-field>
</div>
