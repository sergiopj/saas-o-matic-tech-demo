<div class="search-bar-wrapper">
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
    <mat-icon matPrefix class="search-icon" aria-hidden="true">search</mat-icon>
    <input
      matInput
      type="text"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      [placeholder]="'customers.search.placeholder' | translate"
      [attr.aria-label]="'customers.search.aria' | translate"
    />
    @if (query()) {
      <button
        mat-icon-button
        matSuffix
        type="button"
        class="clear-button"
        [attr.aria-label]="'customers.search.clear.aria' | translate"
        (click)="clear()"
      >
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    }
  </mat-form-field>
</div>
